[package]
name = "hcl-wasm"
version = "0.0.1"
edition = "2024"
rust-version = "1.89.0"
authors = ["Samuel Marks"]
license = "CC0 OR MIT OR Apache-2.0"
repository = "https://github.com/SamuelMarks/hashicorp-configuration-language-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hashicorp-configuration-language-rs = { path = ".." }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", default-features = false }
serde-wasm-bindgen = { version = "0.6", default-features = false }

[lints]
workspace = true
