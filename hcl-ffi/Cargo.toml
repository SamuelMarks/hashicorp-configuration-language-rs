[package]
name = "hcl-ffi"
version = "0.0.1"
edition = "2024"
authors = ["Samuel Marks"]
license = "CC0 OR MIT OR Apache-2.0"
repository = "https://github.com/SamuelMarks/hashicorp-configuration-language-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hashicorp-configuration-language-rs = { path = ".." }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)', 'cfg(tarpaulin_include)'] }
