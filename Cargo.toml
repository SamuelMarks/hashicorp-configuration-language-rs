[workspace]
members = [".", "hcl-macros", "fuzz", "hcl-lsp", "hcl-ffi", "hcl-wasm"]

[package]
name = "hashicorp-configuration-language-rs"
version = "0.0.1"
edition = "2024"
authors = ["Samuel Marks"]
license = "CC0 OR MIT OR Apache-2.0"
repository = "https://github.com/SamuelMarks/hashicorp-configuration-language-rs"

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
bcrypt = { version = "0.19.3", default-features = false, features = ["alloc"] }
bigdecimal = { version = "0.4.10", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "clock", "std"] }
csv = { version = "1.4.0", default-features = false }
derive_more = { version = "2.1.1", default-features = false, features = ["display", "error", "from"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
ipnet = { version = "2.12.1", default-features = false }
logos = { version = "0.16.1", default-features = false, features = ["export_derive"] }
md5 = { version = "0.8.1", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
rsa = { version = "0.9.10", default-features = false, features = ["pem"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
hcl-macros = { path = "hcl-macros" }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
serde_yaml = { version = "0.9.34", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
uuid = { version = "1.26.0", default-features = false, features = ["v4", "v5"] }
unicode-segmentation = { version = "1.12", default-features = false }
encoding_rs = { version = "0.8.35", default-features = false, features = ["alloc"] }

[[bin]]
name = "hclfmt"
path = "src/bin/hclfmt.rs"

[[bin]]
name = "test-err"
path = "src/bin/test_err.rs"

[[bin]]
name = "hcl2json"
path = "src/bin/hcl2json.rs"

[[bin]]
name = "hcl-repl"
path = "src/bin/hcl_repl.rs"

[[bin]]
name = "hcl-validate"
path = "src/bin/hcl_validate.rs"

[[bin]]
name = "grounding"
path = "src/bin/grounding.rs"

[[bin]]
name = "hashicorp-configuration-language-rs"
path = "src/main.rs"

[dev-dependencies]
rand = "0.8"
