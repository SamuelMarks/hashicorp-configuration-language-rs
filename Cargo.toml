[workspace]
members = [".", "hcl-macros", "fuzz", "hcl-lsp", "hcl-ffi", "hcl-wasm"]

[workspace.lints.rust]
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)', 'cfg(tarpaulin_include)', 'cfg(coverage)', 'cfg(coverage_nightly)'] }

[workspace.lints.rustdoc]
missing_crate_level_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"

[package]
name = "hashicorp-configuration-language-rs"
version = "0.0.1"
edition = "2024"
rust-version = "1.89.0"
authors = ["Samuel Marks"]
license = "CC0 OR MIT OR Apache-2.0"
repository = "https://github.com/SamuelMarks/hashicorp-configuration-language-rs"

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
bcrypt = { version = "0.19", default-features = false, features = ["alloc"] }
bigdecimal = { version = "0.4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["now"] }
csv = { version = "1.4", default-features = false }
derive_more = { version = "2.1", default-features = false, features = ["display", "error", "from"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "7.3", default-features = false, features = ["deflate-flate2"] }
ipnet = { version = "2.12", default-features = false }
logos = { version = "0.16", default-features = false, features = ["export_derive"] }
md5 = { version = "0.8", default-features = false }
regex = { version = "1.13", default-features = false, features = ["std", "unicode-perl"] }
rsa = { version = "0.9", default-features = false, features = ["pem"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
hcl-macros = { path = "hcl-macros" }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_yaml = { version = "0.9", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
uuid = { version = "1.26", default-features = false, features = ["v4", "v5"] }
unicode-segmentation = { version = "1.13", default-features = false }
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }

[[bin]]
name = "hclfmt"
path = "src/bin/hclfmt.rs"

[[bin]]
name = "hcl2json"
path = "src/bin/hcl2json.rs"

[[bin]]
name = "hcl-repl"
path = "src/bin/hcl_repl.rs"

[[bin]]
name = "hcl-validate"
path = "src/bin/hcl_validate.rs"

[dev-dependencies]
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }

[lints]
workspace = true
