[package]
name = "hcl-macros"
version = "0.0.1"
edition = "2024"
rust-version = "1.89.0"
authors = ["Samuel Marks"]
license = "CC0 OR MIT OR Apache-2.0"
repository = "https://github.com/SamuelMarks/hashicorp-configuration-language-rs"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
quote = { version = "1.0", default-features = false }
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }

[lints]
workspace = true
